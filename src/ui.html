<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copy character count</title>
<!-- INJECT_CSS -->
</head>
<body>
  <div class="app">
    <section class="panel" id="panel-copy">
      <!-- Frame picker -->
      <div class="copy-section" id="frame-picker">
        <header class="panel-header">
          <h1 class="header-title">Choose a frame to count.</h1>
        </header>
        <div class="search-row">
          <input type="search" id="frame-search" placeholder="Search frames…" />
          <button class="btn btn-secondary" id="use-selection-btn">Use current selection</button>
        </div>
        <div class="frame-list" id="frame-list" role="listbox" aria-label="Top-level frames"></div>
        <div class="state state-empty hidden" id="no-frames-state">
          <p>This page has no top-level frames.</p>
        </div>
      </div>

      <!-- Frame chosen -->
      <div class="copy-section hidden" id="frame-chosen">
        <header class="panel-header">
          <div class="header-row">
            <h1 class="header-title" id="chosen-frame-name">Frame</h1>
            <button class="link-btn" id="change-frame-btn">Change frame</button>
          </div>
          <div class="header-sub" id="chosen-frame-sub">0 text layers</div>
          <div class="warning hidden" id="frame-warning"></div>
          <div class="frame-preview-wrap">
            <img id="frame-preview-img" class="frame-preview hidden" alt="Selected frame preview" />
          </div>
        </header>

        <div class="bulk-controls">
          <label class="select-label">Set all rows to
            <select id="bulk-rounding">
              <option value="none">None</option>
              <option value="down5">Round down to nearest 5</option>
              <option value="up5">Round up to nearest 5</option>
            </select>
          </label>
          <label class="checkbox-inline">
            <input type="checkbox" id="bulk-select-all" checked />
            <span>Select all</span>
          </label>
        </div>

        <div class="table-wrap" id="table-wrap">
          <table class="count-table" id="count-table">
            <thead>
              <tr>
                <th class="col-check"></th>
                <th class="col-label">Text</th>
                <th class="col-raw">Raw</th>
                <th class="col-rounded">Rounded</th>
                <th class="col-mode">Mode</th>
              </tr>
            </thead>
            <tbody id="count-tbody"></tbody>
          </table>
          <div class="state state-empty hidden" id="no-text-state">
            <p>This frame has no text layers.</p>
          </div>
        </div>

        <div class="format-row">
          <label class="select-label">Format
            <select id="format-select">
              <option value="plain">Plain list</option>
              <option value="markdown">Markdown bullets</option>
              <option value="keyvalue">key: value</option>
            </select>
          </label>
        </div>

        <div class="preview-wrap">
          <label for="preview-area" class="preview-label">Preview</label>
          <textarea readonly id="preview-area" class="preview"></textarea>
        </div>

        <div class="copy-actions">
          <button class="btn btn-primary btn-block" id="copy-now-btn">Copy now</button>
        </div>
      </div>
    </section>

    <div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
    <div class="resize-grip" id="resize-grip" aria-hidden="true" title="Drag to resize"></div>
  </div>

<!-- INJECT_JS -->
</body>
</html>
