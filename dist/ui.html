<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Copy character count</title>
<style>/* Copy character count — panel styles. Uses Figma's design tokens (CSS vars)
   where available so the panel adapts to light/dark themes automatically. */

:root {
  --bg: var(--figma-color-bg, #ffffff);
  --bg-secondary: var(--figma-color-bg-secondary, #f5f5f5);
  --bg-tertiary: var(--figma-color-bg-tertiary, #e5e5e5);
  --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
  --text: var(--figma-color-text, #1e1e1e);
  --text-secondary: var(--figma-color-text-secondary, #6e6e6e);
  --text-disabled: var(--figma-color-text-disabled, #b3b3b3);
  --border: var(--figma-color-border, #e6e6e6);
  --border-strong: var(--figma-color-border-strong, #cccccc);
  --brand: var(--figma-color-bg-brand, #0d99ff);
  --brand-text: var(--figma-color-text-onbrand, #ffffff);
  --success: var(--figma-color-bg-success, #14ae5c);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.hidden { display: none !important; }

/* ---------- Panel ---------- */
.panel {
  display: flex;
  flex-direction: column;
  flex: 1;
}

.panel-header {
  padding: 12px;
  border-bottom: 1px solid var(--border);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.header-title {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}
.header-sub {
  margin-top: 4px;
  color: var(--text-secondary);
  font-size: 11px;
}

/* ---------- Buttons ---------- */
.btn {
  font: inherit;
  border-radius: 6px;
  padding: 6px 10px;
  cursor: pointer;
  border: 1px solid var(--border-strong);
  background: var(--bg);
  color: var(--text);
}
.btn:hover { background: var(--bg-hover); }
.btn-primary {
  background: var(--brand);
  color: var(--brand-text);
  border-color: var(--brand);
}
.btn-primary:hover { filter: brightness(1.05); }
.btn-secondary { background: var(--bg-secondary); }
.btn-block { width: 100%; padding: 10px 12px; font-weight: 600; }
.link-btn {
  background: none; border: none;
  color: var(--brand);
  cursor: pointer; padding: 0; font: inherit;
}
.link-btn:hover { text-decoration: underline; }

.checkbox-inline {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--text-secondary);
}

.select-label {
  display: inline-flex;
  flex-direction: column;
  gap: 2px;
  font-size: 11px;
  color: var(--text-secondary);
}
.select-label select {
  font: inherit;
  padding: 4px 6px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
}

/* ---------- States ---------- */
.state {
  padding: 24px 16px;
  text-align: center;
  color: var(--text-secondary);
}

/* ---------- Copy panel ---------- */
.copy-section { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.search-row {
  display: flex;
  gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
}
.search-row input {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  font: inherit;
}
.frame-list {
  flex: 1;
  overflow: auto;
  padding: 4px 0;
}
.frame-item {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: none;
  padding: 8px 12px;
  cursor: pointer;
  color: var(--text);
  font: inherit;
  border-bottom: 1px solid var(--border);
}
.frame-item:hover { background: var(--bg-hover); }
.frame-item[aria-selected="true"] {
  background: var(--bg-tertiary);
  font-weight: 600;
}
.frame-item-path {
  font-size: 10px;
  color: var(--text-secondary);
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.frame-item-name {
  font-size: 12px;
  color: var(--text);
}

.warning {
  margin-top: 8px;
  padding: 6px 8px;
  border-radius: 4px;
  background: rgba(245, 166, 35, 0.15);
  color: var(--text);
  font-size: 11px;
}

.bulk-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-secondary);
  gap: 8px;
}

.table-wrap { flex: 1; overflow: auto; padding: 0; }
.count-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.count-table th,
.count-table td {
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}
.count-table th {
  font-weight: 600;
  background: var(--bg);
  position: sticky;
  top: 0;
  color: var(--text-secondary);
}
.col-check { width: 24px; }
.col-raw, .col-rounded { width: 44px; text-align: right; font-variant-numeric: tabular-nums; }
.count-table td.col-raw,
.count-table td.col-rounded { text-align: right; font-variant-numeric: tabular-nums; }
.col-mode { width: 130px; }
.count-table select {
  width: 100%;
  padding: 2px 4px;
  font: inherit;
  border: 1px solid var(--border-strong);
  border-radius: 3px;
  background: var(--bg);
  color: var(--text);
}
.cell-label {
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.format-row {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
  background: var(--bg-secondary);
}

.preview-wrap {
  padding: 8px 12px;
  border-top: 1px solid var(--border);
}
.preview-label {
  display: block;
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}
.preview {
  width: 100%;
  min-height: 80px;
  resize: vertical;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 11px;
  padding: 6px 8px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text);
}

.copy-actions {
  padding: 8px 12px 12px;
  border-top: 1px solid var(--border);
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 16px;
  transform: translateX(-50%);
  background: var(--text);
  color: var(--bg);
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 11px;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
}

/* ---------- Frame preview thumbnail ---------- */
.frame-preview-wrap {
  margin-top: 10px;
  display: flex;
  justify-content: center;
}
.frame-preview {
  display: block;
  max-width: 100%;
  max-height: 200px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  object-fit: contain;
}

/* ---------- Resize grip ---------- */
.resize-grip {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 14px;
  height: 14px;
  cursor: nwse-resize;
  z-index: 100;
  /* Two diagonal lines drawn with linear-gradient — works in light & dark. */
  background:
    linear-gradient(
      135deg,
      transparent 0%,
      transparent 40%,
      var(--text-secondary) 40%,
      var(--text-secondary) 50%,
      transparent 50%,
      transparent 65%,
      var(--text-secondary) 65%,
      var(--text-secondary) 75%,
      transparent 75%
    );
  opacity: 0.6;
}
.resize-grip:hover { opacity: 1; }
</style>
</head>

  <div class="app">

    <div class="resize-grip" id="resize-grip" aria-hidden="true" title="Drag to resize"></div>
  </div>

  var toastTimer;
  function toast(message) {
    const el = byId("toast");
    el.textContent = message;
    el.classList.remove("hidden");
    if (toastTimer) window.clearTimeout(toastTimer);
    toastTimer = window.setTimeout(() => {
      el.classList.add("hidden");
    }, 2200);
  }
  var MIN_W = 320;
  var MIN_H = 400;
  var MAX_W = 1200;
  var MAX_H = 1400;
  function wireResizeGrip() {
    const grip = byId("resize-grip");
    let resizing = false;
    let rafPending = false;
    let pendingW = 0;
    let pendingH = 0;
    function flush() {
      rafPending = false;
      send({ type: "resize", width: pendingW, height: pendingH });
    }
    grip.addEventListener("mousedown", (e) => {
      resizing = true;
      e.preventDefault();
      document.body.style.userSelect = "none";
    });
    window.addEventListener("mousemove", (e) => {
      if (!resizing) return;
      pendingW = Math.max(MIN_W, Math.min(MAX_W, e.clientX + 8));
      pendingH = Math.max(MIN_H, Math.min(MAX_H, e.clientY + 8));
      if (!rafPending) {
        rafPending = true;
        requestAnimationFrame(flush);
      }
    });
    window.addEventListener("mouseup", () => {
      if (!resizing) return;
      resizing = false;
      document.body.style.userSelect = "";
    });
  }
})();
</script>
